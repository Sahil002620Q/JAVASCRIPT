<script>
    let map = L.map("map").setView([0, 0], 2);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

let marker;

window.showLocation = function(lat, lon) {

    map.setView([lat, lon], 5);

    if (marker) {
        map.removeLayer(marker);
    }

    marker = L.marker([lat, lon]).addTo(map);

    marker.bindPopup(
        "ISS<br>Latitude: " + lat +
        "<br>Longitude: " + lon
    ).openPopup();
};
</script>
    <script type="py">
from pyscript import document
from pyodide.ffi import create_proxy
import random 
from js import fetch




async def roll(event):
    r = await fetch("https://api.open-notify.org/iss-now.json")
    data = await r.json()

    latti = float(data["iss_position"]["latitude"])
    longi = float(data["iss_position"]["longitude"])

    document.querySelector("#count").innerText = (
        f"Lat: {latti}, Lon: {longi}"
    )

    url = f"https://www.google.com/maps?q={latti},{longi}"

    document.querySelector("#map").src = url


mapx = document.querySelector("#mapx")
div = document.querySelector("#box")

mapx.addEventListener("click", create_proxy(roll))
    </script>
